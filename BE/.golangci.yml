version: "2"

run:
  timeout: 5m

linters:
  # errcheck, govet, ineffassign, staticcheck, unused
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nilerr
    - sqlclosecheck
    - unconvert
  exclusions:
    presets:
      # Unchecked errors from deferred Close/Flush, fmt prints and similar.
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - restaurant-space/api
